# Builds a signed Android App Bundle (.aab). Always attached to the run as an artifact (download it for
# the first, manual Play Console upload). Once PLAY_SERVICE_ACCOUNT_JSON is set, later runs also push
# the bundle to the Play internal-testing track.
#
# Secrets:
#   ANDROID_KEYSTORE_BASE64   upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON (optional) Google Cloud service account with Play Console release access
name: Android → Play
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track (internal | alpha (= closed testing) | production)
        default: internal
      status:
        description: Release status. Keep 'draft' until the app's first release is live in Play Console, then 'completed'
        default: draft
  push:
    tags: ['v*']
concurrency: { group: android-release, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build web + sync native project
        run: npm run build && npx cap sync android
      - name: Version
        run: |
          VER=$(node -p "require('./package.json').version")
          node scripts/set-version.mjs "$VER" "$(( ${{ github.run_number }} + 100 ))"
      - name: Signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building an UNSIGNED bundle (fine for checking the build, not uploadable)"; exit 0; fi
          echo "$KS" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
      - name: Bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: opencoach-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true' && hashFiles('android/keystore.properties') != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.noahfrain.opencoach
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'draft' }}
      - name: Clean up signing files
        if: always()
        run: rm -f android/app/release.jks android/keystore.properties
